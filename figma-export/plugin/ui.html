<!doctype html>
<html>
<body style="font:12px/1.5 Inter,system-ui,sans-serif;margin:0;padding:16px;color:var(--figma-color-text,#16211F);background:var(--figma-color-bg,#fff)">
  <div style="font-weight:700;font-size:14px;margin-bottom:2px">SkillLearn Importer v2</div>
  <div style="color:var(--figma-color-text-secondary,#4A5856);margin-bottom:14px">
    Membuat variables & styles, lalu membangun semua layar sebagai layer yang bisa diedit.
  </div>

  <label for="tokens" style="display:block;font-weight:600;margin-bottom:4px">1. tokens.json</label>
  <input id="tokens" type="file" accept=".json" style="margin-bottom:12px;width:100%">

  <label for="layers" style="display:block;font-weight:600;margin-bottom:4px">2. skilllearn-layers.json</label>
  <input id="layers" type="file" accept=".json" style="margin-bottom:12px;width:100%">

  <label for="refs" style="display:block;font-weight:600;margin-bottom:4px">3. Kanvas referensi (folder reference, semua PNG)</label>
  <input id="refs" type="file" accept="image/png" multiple style="margin-bottom:14px;width:100%">

  <button id="go" style="width:100%;height:36px;border:0;border-radius:8px;background:#0E5E52;color:#fff;font-weight:700;cursor:pointer">Import</button>
  <div id="status" role="status" style="margin-top:12px;color:var(--figma-color-text-secondary,#4A5856);white-space:pre-wrap"></div>

<script>
const $ = (id) => document.getElementById(id);
const status = (t) => { $('status').textContent = t; };
onmessage = (e) => {
  const m = e.data.pluginMessage;
  if (!m || !m.status) return;
  status(m.status);
  if (m.done) $('go').disabled = false;
};

async function readJson(file) {
  try { return JSON.parse(await file.text()); } catch { throw new Error(file.name + ' bukan file JSON yang valid.'); }
}

$('go').onclick = async () => {
  try {
    const tf = $('tokens').files[0];
    const lf = $('layers').files[0];
    const refs = [...$('refs').files];
    if (!tf && !lf && !refs.length) return status('Pilih minimal satu file dulu.');
    $('go').disabled = true;
    status('Membaca file…');

    let tokens = null;
    if (tf) {
      tokens = await readJson(tf);
      if (!tokens.color || !tokens.typography) throw new Error(`"${tf.name}" bukan tokens.json. Pilih file tokens.json (bukan manifest.json).`);
    }
    let layers = null;
    if (lf) {
      layers = await readJson(lf);
      if (layers.format !== 'skilllearn-layers') throw new Error(`"${lf.name}" bukan skilllearn-layers.json.`);
    }
    const images = [];
    for (const f of refs) images.push({ name: f.name, bytes: new Uint8Array(await f.arrayBuffer()) });

    parent.postMessage({ pluginMessage: { type: 'import', tokens, layers, images } }, '*');
  } catch (err) {
    status('Error: ' + err.message);
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
