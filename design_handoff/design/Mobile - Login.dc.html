<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><style>body{margin:0;background:#E3E8E6;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#16211F;-webkit-font-smoothing:antialiased}a{color:#0E5E52;text-decoration:none}a:hover{color:#0B4D43}*{box-sizing:border-box}input,button,textarea{font-family:inherit}@keyframes sl-spin{to{transform:rotate(360deg)}}</style></helmet>
<div data-screen-label="Mobile Login" style="width:100%;max-width:390px;min-height:100vh;margin:0 auto;background:#fff;display:flex;flex-direction:column">
  <div style="height:50px;flex:none;padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700"><span>9:41</span><span style="width:24px;height:11px;border:1.5px solid #16211F;border-radius:3px"></span></div>
  <form onSubmit="{{ submit }}" noValidate="{{ true }}" style="flex:1;padding:16px 24px 32px;display:flex;flex-direction:column;gap:16px">
    <a href="Mobile - Splash.dc.html" style="font-size:22px;color:#16211F;width:44px;height:44px;display:flex;align-items:center" style-active="opacity:.6">←</a>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:6px"><div style="font-size:28px;font-weight:800;letter-spacing:-.02em">Welcome back</div><div style="font-size:15px;color:#4A5856">Log in to continue learning.</div></div>
    <sc-if value="{{ expired }}" hint-placeholder-val="{{ false }}"><div role="status" style="padding:12px 14px;border-radius:12px;background:#FBF3DF;border:1px solid #F0E2B8;color:#5E420C;font-size:13px;font-weight:600;line-height:1.5">Your session expired. Log in again to continue.</div></sc-if>
    <sc-if value="{{ hasFormErr }}" hint-placeholder-val="{{ false }}"><div role="alert" style="padding:12px 14px;border-radius:12px;background:#FBE9E5;color:#9A3322;font-size:13px;font-weight:600;line-height:1.5">{{ formErr }}</div></sc-if>
    <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600">Email</span><input type="email" value="{{ email }}" onChange="{{ onEmail }}" aria-invalid="{{ fe.email.invalid }}" placeholder="you@student.ac.id" style="height:52px;border:1px solid {{ fe.email.border }};background:{{ fe.email.bg }};border-radius:12px;padding:0 16px;font-size:16px;color:#16211F;outline-color:#0E5E52"><sc-if value="{{ fe.email.has }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;font-weight:600;color:#C2412D">{{ fe.email.msg }}</span></sc-if></label>
    <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600">Password</span><span style="position:relative;display:flex"><input type="{{ pwType }}" value="{{ pw }}" onChange="{{ onPw }}" aria-invalid="{{ fe.pw.invalid }}" placeholder="At least 8 characters" style="flex:1;min-width:0;height:52px;border:1px solid {{ fe.pw.border }};background:{{ fe.pw.bg }};border-radius:12px;padding:0 64px 0 16px;font-size:16px;color:#16211F;outline-color:#0E5E52"><button type="button" onClick="{{ toggleShow }}" style="position:absolute;right:6px;top:6px;height:40px;padding:0 10px;border:0;background:transparent;font-size:13px;font-weight:600;color:#4A5856" style-active="opacity:.6">{{ showLabel }}</button></span><sc-if value="{{ fe.pw.has }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;font-weight:600;color:#C2412D">{{ fe.pw.msg }}</span></sc-if></label>
    <a href="Mobile - Forgot Password.dc.html" style="align-self:flex-end;font-size:14px;font-weight:600;min-height:44px;display:flex;align-items:center" style-active="opacity:.6">Forgot password?</a>
    <div style="flex:1;min-height:24px"></div>
    <button type="submit" disabled="{{ busy }}" style="height:54px;border:0;border-radius:12px;background:{{ btnBg }};color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px" style-active="background:#0B4D43"><sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}"><span style="width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sl-spin .8s linear infinite"></span></sc-if>{{ btnLabel }}</button>
    <div style="font-size:14px;color:#4A5856;text-align:center">New here? <a href="Mobile - Register.dc.html" style="font-weight:700" style-active="opacity:.7">Create an account</a></div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: 'alya@student.ac.id', pw: 'skilllearn1', show: false, errors: {}, formErr: '', busy: false, expired: /expired=1/.test(location.hash) };
  renderVals() {
    const s = this.state;
    const F = (k) => { const m = s.errors[k]; return { has: !!m, msg: m || '', border: m ? '#C2412D' : '#D5DDDA', bg: m ? '#FFF8F6' : '#fff', invalid: m ? 'true' : 'false' }; };
    return {
      email: s.email, pw: s.pw, pwType: s.show ? 'text' : 'password', showLabel: s.show ? 'Hide' : 'Show',
      fe: { email: F('email'), pw: F('pw') }, expired: s.expired, hasFormErr: !!s.formErr, formErr: s.formErr,
      busy: s.busy, btnLabel: s.busy ? 'Logging in…' : 'Log in', btnBg: s.busy ? '#4F8C82' : '#0E5E52',
      onEmail: (e) => this.setState({ email: e.target.value, errors: { ...s.errors, email: '' }, formErr: '' }),
      onPw: (e) => this.setState({ pw: e.target.value, errors: { ...s.errors, pw: '' }, formErr: '' }),
      toggleShow: () => this.setState({ show: !s.show }),
      submit: (e) => {
        e.preventDefault();
        if (s.busy) return;
        const errors = {};
        if (!s.email.trim()) errors.email = 'Email is required.';
        else if (!/^\S+@\S+\.\S+$/.test(s.email)) errors.email = 'Enter a valid email, e.g. name@student.ac.id.';
        if (!s.pw) errors.pw = 'Password is required.';
        else if (s.pw.length < 8) errors.pw = 'Password must be at least 8 characters.';
        if (errors.email || errors.pw) return this.setState({ errors });
        this.setState({ busy: true, errors: {}, formErr: '', expired: false });
        setTimeout(() => {
          if (s.email.toLowerCase() === 'wrong@student.ac.id') { this.fails = (this.fails || 0) + 1; return this.setState({ busy: false, formErr: this.fails >= 5 ? 'Too many attempts. Try again in 15 minutes.' : 'Email or password is incorrect. Check both and try again.' }); }
          let prev = null; try { prev = JSON.parse(localStorage.getItem('skilllearn-user')); } catch (e) {}
          if (!(prev && prev.email && prev.email.toLowerCase() === s.email.toLowerCase()))
          localStorage.setItem('skilllearn-user', JSON.stringify({ name: 'Alya Rahma', email: s.email, isNew: false, joined: 'March 2026', bio: 'Informatics student. Learning React and UI design.', interests: ['Programming', 'Graphic Design'] }));
          location.href = 'Mobile - Home.dc.html';
        }, 800);
      }
    };
  }
}
</script>
</body>
</html>
