<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><style>body{margin:0;background:#E3E8E6;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#16211F;-webkit-font-smoothing:antialiased}a{color:#0E5E52;text-decoration:none}a:hover{color:#0B4D43}*{box-sizing:border-box}input,button,textarea{font-family:inherit}</style></helmet>
<div data-screen-label="Mobile Course Detail" style="width:100%;max-width:390px;min-height:100vh;margin:0 auto;background:#fff;display:flex;flex-direction:column">
  <sc-if value="{{ notReady }}" hint-placeholder-val="{{ false }}"><dc-import name="StatusBlock" kind="{{ status }}" layout="detail" platform="m" on-retry="{{ retry }}" hint-size="100%,640px"></dc-import></sc-if>
  <sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
  <div style="height:50px;flex:none;padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;background:#16211F;color:#fff"><span>9:41</span><span style="width:24px;height:11px;border:1.5px solid #fff;border-radius:3px"></span></div>
  <div style="aspect-ratio:16/10;flex:none;background-color:#16211F;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 12px,transparent 12px 24px);position:relative;display:flex;align-items:center;justify-content:center">
    <a href="Mobile - Home.dc.html" style="position:absolute;left:8px;top:4px;color:#fff;font-size:20px;width:44px;height:44px;display:flex;align-items:center;justify-content:center" style-active="opacity:.7">←</a>
    <button onClick="{{ togglePlay }}" style="width:60px;height:60px;border-radius:50%;border:0;background:#fff;display:flex;align-items:center;justify-content:center" style-active="opacity:.7"><svg width="22" height="22" viewBox="0 0 24 24" fill="#0E5E52"><path d="{{ playIcon }}"></path></svg></button>
    <div style="position:absolute;left:16px;right:16px;bottom:12px;height:4px;border-radius:2px;background:rgba(255,255,255,.25)"><div style="width:30%;height:4px;border-radius:2px;background:#F2A93B"></div></div>
  </div>
  <div style="flex:1;padding:18px 20px 24px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
      <div style="display:flex;flex-direction:column;gap:6px"><span style="font:500 10px 'JetBrains Mono',monospace;color:{{ c.fg }};letter-spacing:.08em">{{ eyebrow }}</span><span style="font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.25">{{ c.title }}</span><span style="font-size:13px;color:#4A5856">{{ c.lessons }} lessons · {{ c.dur }} · ★ {{ c.rating }}</span></div>
      <button onClick="{{ c.toggle }}" title="{{ c.favLabel }}" style="width:44px;height:44px;flex:none;border-radius:12px;border:1px solid #D5DDDA;background:#fff;display:flex;align-items:center;justify-content:center" style-active="opacity:.7"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{ c.favFill }}" stroke="{{ c.favStroke }}" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></button>
    </div>
    <div style="display:flex;gap:22px;border-bottom:1px solid #E3E8E6;font-size:14px;font-weight:600">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2"><button onClick="{{ t.pick }}" style="padding:0 0 10px;border:0;background:transparent;border-bottom:2px solid {{ t.line }};color:{{ t.color }};font-size:14px;font-weight:600;min-height:40px" style-active="opacity:.7">{{ t.name }}</button></sc-for>
    </div>
    <sc-if value="{{ showLessons }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div style="flex:1;height:6px;border-radius:3px;background:#E3E8E6"><div style="width:{{ progressW }};height:6px;border-radius:3px;background:#0E5E52"></div></div><span style="font-size:12px;font-weight:700">{{ progressW }}</span></div>
        <sc-for list="{{ lessons }}" as="l" hint-placeholder-count="6">
          <a href="{{ l.href }}" style="padding:11px 10px;margin:0 -10px;border-radius:10px;display:flex;gap:12px;align-items:center;background:{{ l.rowBg }};color:#16211F;min-height:56px" style-active="opacity:.7">
            <span style="width:28px;height:28px;flex:none;border-radius:50%;background:{{ l.numBg }};color:{{ l.numFg }};font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ l.mark }}</span>
            <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600">{{ l.title }}</span><span style="font-size:12px;color:#4A5856">{{ l.type }} · {{ l.dur }}</span></span>
          </a>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ showAbout }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="font-size:15px;line-height:1.65;color:#2E3A38">{{ c.desc }}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <sc-for list="{{ facts }}" as="f" hint-placeholder-count="4"><div style="background:#F6F8F7;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#4A5856">{{ f.k }}</span><span style="font-size:15px;font-weight:700">{{ f.v }}</span></div></sc-for>
        </div>
        <div style="font-size:14px;color:#4A5856">Instructor: <span style="font-weight:700;color:#16211F">{{ c.author }}</span></div>
      </div>
    </sc-if>
  </div>
  <div style="position:sticky;bottom:0;flex:none;padding:12px 20px 30px;border-top:1px solid #E3E8E6;background:#fff"><a href="{{ nextHref }}" style="height:54px;border-radius:12px;background:#0E5E52;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center" style-active="opacity:.7">{{ ctaLabel }}</a></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { D: null, favs: null, playing: false, tab: 'lessons' };
  componentDidMount() { this.boot = () => import(new URL('sl-data.js', location.href).href).then(D => { this.setState({ D, favs: D.getFavs(), status: 'loading' }); return D.load().then(() => this.setState({ status: 'ready' }), () => this.setState({ status: 'error' })); });
    this.boot(); }
  renderVals() {
    const st = this.state.status || 'loading';
    const base = { status: st, ready: st === 'ready', notReady: st !== 'ready', retry: () => { this.setState({ status: 'loading' }); this.boot(); } };
    if (st !== 'ready' || !this.state.D) return base;
    const v = this.vals();
    if (v.__notfound) return { ...base, status: 'notfound', ready: false, notReady: true };
    return { ...base, ...v };
  }
  vals() {
    const D = this.state.D;
    if (D.param('c') && !D.findCourse(D.param('c'))) return { __notfound: true };
    const raw = D.course(D.param('c'));
    const c = D.card('m', raw, this.state.favs, (f) => this.setState({ favs: f }));
    const ls = D.lessons('m', raw), cur = ls[raw.current], tab = this.state.tab;
    return {
      c, lessons: ls, eyebrow: (c.catName + ' · ' + c.level).toUpperCase(),
      playIcon: this.state.playing ? 'M7 5h4v14H7zM13 5h4v14h-4z' : 'M7 4v16l13-8z',
      togglePlay: () => this.setState({ playing: !this.state.playing }),
      tabs: [['lessons', 'Lessons'], ['about', 'About']].map(([id, name]) => ({ name, pick: () => this.setState({ tab: id }), line: tab === id ? '#0E5E52' : 'transparent', color: tab === id ? '#16211F' : '#4A5856' })),
      showLessons: tab === 'lessons', showAbout: tab === 'about',
      progressW: raw.progress + '%',
      nextHref: cur.href, ctaLabel: raw.progress > 0 ? 'Continue lesson ' + (raw.current + 1) : 'Start course',
      facts: [{ k: 'Lessons', v: String(raw.lessons) }, { k: 'Duration', v: raw.dur }, { k: 'Level', v: raw.level }, { k: 'Rating', v: '★ ' + raw.rating }]
    };
  }
}
</script>
</body>
</html>
