<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:84px;background:#fff;border-top:1px solid #E3E8E6;display:grid;grid-template-columns:repeat(3,1fr);padding-top:10px;font-family:'Plus Jakarta Sans',system-ui,sans-serif">
  <a href="Mobile - Home.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:{{ cHome }};text-decoration:none" style-active="opacity:.7"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"></path></svg>Home</a>
  <a href="Mobile - Search.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:{{ cSearch }};text-decoration:none" style-active="opacity:.7"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Search</a>
  <a href="Mobile - Profile.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:{{ cProfile }};text-decoration:none" style-active="opacity:.7"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Profile</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;390px&quot;,&quot;height&quot;:&quot;84px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;search&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home'|'search'|'profile'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active;
    const c = (k) => (a === k ? '#0E5E52' : '#4A5856');
    return { cHome: c('home'), cSearch: c('search'), cProfile: c('profile') };
  }
}
</script>
</body>
</html>
