<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><style>body{margin:0;background:#F6F8F7;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#16211F;-webkit-font-smoothing:antialiased}a{color:#0E5E52;text-decoration:none}a:hover{color:#0B4D43}*{box-sizing:border-box}input,button,textarea{font-family:inherit}@keyframes sl-spin{to{transform:rotate(360deg)}}</style></helmet>
<div data-screen-label="Web Forgot Password" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 24px;background:#F6F8F7">
  <a href="Web - Login.dc.html" style="display:flex;align-items:center;gap:10px;color:#16211F"><svg width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#0E5E52"></rect><path d="M8 23h5v-5h5v-5h5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="23.5" cy="8.5" r="2.6" fill="#F2A93B"></circle></svg><span style="font-size:19px;font-weight:800">SkillLearn</span></a>
  <div style="flex:1;display:flex;align-items:center;width:100%;justify-content:center">
    <div style="width:100%;max-width:440px;background:#fff;border:1px solid #E3E8E6;border-radius:18px;padding:36px;display:flex;flex-direction:column;gap:18px">
      <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{ submit }}" noValidate="{{ true }}" style="display:flex;flex-direction:column;gap:18px">
          <div style="display:flex;flex-direction:column;gap:6px"><div style="font-size:26px;font-weight:800;letter-spacing:-.02em">Reset your password</div><div style="font-size:14px;line-height:1.55;color:#4A5856">Enter the email you registered with. We'll send a link to set a new password.</div></div>
          <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600">Email</span><input type="email" value="{{ email }}" onChange="{{ onEmail }}" aria-invalid="{{ fe.invalid }}" placeholder="you@student.ac.id" style="height:48px;border:1px solid {{ fe.border }};background:{{ fe.bg }};border-radius:10px;padding:0 14px;font-size:15px;color:#16211F;outline-color:#0E5E52"><sc-if value="{{ fe.has }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;font-weight:600;color:#C2412D">{{ fe.msg }}</span></sc-if></label>
          <button type="submit" disabled="{{ busy }}" style="height:48px;border:0;border-radius:10px;background:{{ btnBg }};color:#fff;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px" style-hover="background:#0B4D43"><sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}"><span style="width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sl-spin .8s linear infinite"></span></sc-if>{{ btnLabel }}</button>
        </form>
      </sc-if>
      <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:16px">
          <div style="width:52px;height:52px;border-radius:14px;background:#E7F3F0;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0E5E52" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg></div>
          <div style="display:flex;flex-direction:column;gap:6px"><div style="font-size:26px;font-weight:800;letter-spacing:-.02em">Check your inbox</div><div style="font-size:14px;line-height:1.55;color:#4A5856">If an account exists for <span style="font-weight:700;color:#16211F">{{ email }}</span>, a reset link is on its way. The link expires in 30 minutes.</div></div>
          <button onClick="{{ resend }}" disabled="{{ cooling }}" style="height:46px;border-radius:10px;border:1px solid #D5DDDA;background:#fff;font-weight:600;font-size:14px;cursor:pointer;color:{{ resendColor }}" style-hover="background:#F6F8F7">{{ resendLabel }}</button>
        </div>
      </sc-if>
      <a href="Web - Login.dc.html" style="font-size:14px;font-weight:700;text-align:center">← Back to log in</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: '', sent: false, err: '', busy: false, cool: 0 };
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const s = this.state, m = s.err;
    const startCool = () => { this.setState({ cool: 30 }); clearInterval(this.t); this.t = setInterval(() => this.setState(x => { if (x.cool <= 1) clearInterval(this.t); return { cool: x.cool - 1 }; }), 1000); };
    return {
      email: s.email, sent: s.sent, notSent: !s.sent,
      fe: { has: !!m, msg: m, border: m ? '#C2412D' : '#D5DDDA', bg: m ? '#FFF8F6' : '#fff', invalid: m ? 'true' : 'false' },
      busy: s.busy, btnLabel: s.busy ? 'Sending…' : 'Send reset link', btnBg: s.busy ? '#4F8C82' : '#0E5E52',
      cooling: s.cool > 0, resendLabel: s.cool > 0 ? 'Resend available in ' + s.cool + 's' : 'Resend link', resendColor: s.cool > 0 ? '#8A9693' : '#16211F',
      onEmail: (e) => this.setState({ email: e.target.value, err: '' }),
      resend: () => { if (s.cool <= 0) startCool(); },
      submit: (e) => {
        e.preventDefault();
        if (s.busy) return;
        if (!s.email.trim()) return this.setState({ err: 'Email is required.' });
        if (!/^\S+@\S+\.\S+$/.test(s.email)) return this.setState({ err: 'Enter a valid email, e.g. name@student.ac.id.' });
        this.setState({ busy: true });
        setTimeout(() => { this.setState({ busy: false, sent: true }); startCool(); }, 800);
      }
    };
  }
}
</script>
</body>
</html>
