<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><style>body{margin:0;background:#E3E8E6;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#16211F;-webkit-font-smoothing:antialiased}a{color:#0E5E52;text-decoration:none}a:hover{color:#0B4D43}*{box-sizing:border-box}input,button,textarea{font-family:inherit}@keyframes sl-spin{to{transform:rotate(360deg)}}</style></helmet>
<div data-screen-label="Mobile Forgot Password" style="width:100%;max-width:390px;min-height:100vh;margin:0 auto;background:#fff;display:flex;flex-direction:column">
  <div style="height:50px;flex:none;padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700"><span>9:41</span><span style="width:24px;height:11px;border:1.5px solid #16211F;border-radius:3px"></span></div>
  <div style="flex:1;padding:16px 24px 32px;display:flex;flex-direction:column;gap:18px">
    <a href="Mobile - Login.dc.html" style="font-size:22px;color:#16211F;width:44px;height:44px;display:flex;align-items:center" style-active="opacity:.6">←</a>
    <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
      <form onSubmit="{{ submit }}" noValidate="{{ true }}" style="flex:1;display:flex;flex-direction:column;gap:18px">
        <div style="display:flex;flex-direction:column;gap:6px"><div style="font-size:28px;font-weight:800;letter-spacing:-.02em">Reset password</div><div style="font-size:15px;line-height:1.55;color:#4A5856">Enter the email you registered with. We'll send a link to set a new password.</div></div>
        <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600">Email</span><input type="email" value="{{ email }}" onChange="{{ onEmail }}" aria-invalid="{{ fe.invalid }}" placeholder="you@student.ac.id" style="height:52px;border:1px solid {{ fe.border }};background:{{ fe.bg }};border-radius:12px;padding:0 16px;font-size:16px;color:#16211F;outline-color:#0E5E52"><sc-if value="{{ fe.has }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;font-weight:600;color:#C2412D">{{ fe.msg }}</span></sc-if></label>
        <div style="flex:1;min-height:24px"></div>
        <button type="submit" disabled="{{ busy }}" style="height:54px;border:0;border-radius:12px;background:{{ btnBg }};color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px" style-active="background:#0B4D43"><sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}"><span style="width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sl-spin .8s linear infinite"></span></sc-if>{{ btnLabel }}</button>
      </form>
    </sc-if>
    <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1;display:flex;flex-direction:column;gap:16px">
        <div style="width:56px;height:56px;border-radius:16px;background:#E7F3F0;display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E5E52" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg></div>
        <div style="font-size:28px;font-weight:800;letter-spacing:-.02em">Check your inbox</div>
        <div style="font-size:15px;line-height:1.55;color:#4A5856">If an account exists for <span style="font-weight:700;color:#16211F">{{ email }}</span>, a reset link is on its way. It expires in 30 minutes.</div>
        <div style="flex:1;min-height:24px"></div>
        <a href="Mobile - Login.dc.html" style="height:54px;border-radius:12px;background:#0E5E52;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center" style-active="background:#0B4D43">Back to log in</a>
        <button onClick="{{ resend }}" disabled="{{ cooling }}" style="height:48px;border:0;background:transparent;font-size:15px;font-weight:600;color:{{ resendColor }}" style-active="opacity:.6">{{ resendLabel }}</button>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: '', sent: false, err: '', busy: false, cool: 0 };
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const s = this.state, m = s.err;
    const startCool = () => { this.setState({ cool: 30 }); clearInterval(this.t); this.t = setInterval(() => this.setState(x => { if (x.cool <= 1) clearInterval(this.t); return { cool: x.cool - 1 }; }), 1000); };
    return {
      email: s.email, sent: s.sent, notSent: !s.sent,
      fe: { has: !!m, msg: m, border: m ? '#C2412D' : '#D5DDDA', bg: m ? '#FFF8F6' : '#fff', invalid: m ? 'true' : 'false' },
      busy: s.busy, btnLabel: s.busy ? 'Sending…' : 'Send reset link', btnBg: s.busy ? '#4F8C82' : '#0E5E52',
      cooling: s.cool > 0, resendLabel: s.cool > 0 ? 'Resend in ' + s.cool + 's' : 'Resend link', resendColor: s.cool > 0 ? '#8A9693' : '#0E5E52',
      onEmail: (e) => this.setState({ email: e.target.value, err: '' }),
      resend: () => { if (s.cool <= 0) startCool(); },
      submit: (e) => {
        e.preventDefault();
        if (s.busy) return;
        if (!s.email.trim()) return this.setState({ err: 'Email is required.' });
        if (!/^\S+@\S+\.\S+$/.test(s.email)) return this.setState({ err: 'Enter a valid email, e.g. name@student.ac.id.' });
        this.setState({ busy: true });
        setTimeout(() => { this.setState({ busy: false, sent: true }); startCool(); }, 800);
      }
    };
  }
}
</script>
</body>
</html>
