<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:68px;background:#fff;border-bottom:1px solid #E3E8E6;padding:0 40px;display:flex;align-items:center;gap:32px;font-family:'Plus Jakarta Sans',system-ui,sans-serif">
  <a href="Web - Home.dc.html" style="display:flex;align-items:center;gap:10px;color:#16211F;text-decoration:none"><svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#0E5E52"></rect><path d="M8 23h5v-5h5v-5h5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="23.5" cy="8.5" r="2.6" fill="#F2A93B"></circle></svg><span style="font-size:18px;font-weight:800">SkillLearn</span></a>
  <div style="display:flex;gap:24px;font-size:14px;font-weight:600">
    <a href="Web - Home.dc.html" style="color:{{ cHome }};text-decoration:none;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s,color .15s" style-hover="color:#0E5E52">Home</a>
    <a href="Web - Profile.dc.html" style="color:{{ cFav }};text-decoration:none;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s,color .15s" style-hover="color:#0E5E52">Favorites</a>
    <a href="Web - Profile.dc.html" style="color:{{ cHist }};text-decoration:none;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s,color .15s" style-hover="color:#0E5E52">History</a>
  </div>
  <div style="flex:1"></div>
  <form onSubmit="{{ onSearch }}" style="width:320px;max-width:32vw;height:40px;border-radius:10px;background:#F6F8F7;border:1px solid #E3E8E6;display:flex;align-items:center;gap:8px;padding:0 12px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5856" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <input value="{{ q }}" onChange="{{ onQ }}" placeholder="Search courses, topics…" style="flex:1;min-width:0;border:0;background:transparent;outline:none;font:inherit;font-size:14px;color:#16211F">
  </form>
  <a href="Web - Profile.dc.html" style="width:38px;height:38px;border-radius:50%;background:#F2A93B;color:#16211F;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:{{ avatarRing }}">{{ ini }}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;68px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;profile&quot;,&quot;none&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home'|'profile'|'none'&quot;}}">
class Component extends DCLogic {
  state = { q: new URLSearchParams(location.hash.slice(1)).get('q') || '' };
  renderVals() {
    const a = this.props.active;
    const c = (k) => (a === k ? '#0E5E52' : '#4A5856');
    let u = null; try { u = JSON.parse(localStorage.getItem('skilllearn-user')); } catch (e) {}
    const name = (u && u.name) || 'Alya Rahma';
    return {
      ini: name.split(' ').filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase(),
      cHome: c('home'), cFav: c('profile'), cHist: c('profile'),
      avatarRing: a === 'profile' ? '0 0 0 2px #fff,0 0 0 4px #0E5E52' : 'none',
      q: this.state.q,
      onQ: (e) => this.setState({ q: e.target.value }),
      onSearch: (e) => { e.preventDefault(); location.href = 'Web - Search.dc.html#q=' + encodeURIComponent(this.state.q); }
    };
  }
}
</script>
</body>
</html>
