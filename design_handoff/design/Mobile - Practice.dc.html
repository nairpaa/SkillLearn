<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><style>body{margin:0;background:#E3E8E6;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#16211F;-webkit-font-smoothing:antialiased}a{color:#0E5E52;text-decoration:none}a:hover{color:#0B4D43}*{box-sizing:border-box}input,button,textarea{font-family:inherit}</style></helmet>
<div data-screen-label="Mobile Practice" style="width:100%;max-width:390px;min-height:100vh;margin:0 auto;background:#fff;display:flex;flex-direction:column">
  <sc-if value="{{ notReady }}" hint-placeholder-val="{{ false }}"><dc-import name="StatusBlock" kind="{{ status }}" layout="detail" platform="m" on-retry="{{ retry }}" hint-size="100%,640px"></dc-import></sc-if>
  <sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
  <div style="position:sticky;top:0;z-index:5;background:#fff">
    <div style="height:50px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700"><span>9:41</span><span style="width:24px;height:11px;border:1.5px solid #16211F;border-radius:3px"></span></div>
    <div style="padding:0 20px 0 8px;display:flex;align-items:center;gap:6px"><a href="Mobile - Course Detail.dc.html#c=react" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#16211F" style-active="opacity:.7">←</a><div style="display:flex;flex-direction:column"><span style="font-size:15px;font-weight:700">Build a to-do list</span><span style="font-size:12px;color:#4A5856">Practice · Lesson 6</span></div></div>
    <div style="margin:12px 20px 0;height:44px;padding:4px;border-radius:12px;background:#E3E8E6;display:grid;grid-template-columns:repeat(3,1fr)">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><button onClick="{{ t.pick }}" style="border:0;border-radius:9px;background:{{ t.bg }};color:{{ t.color }};font-size:14px;font-weight:700" style-active="opacity:.7">{{ t.name }}</button></sc-for>
    </div>
    <div style="height:12px"></div>
  </div>
  <sc-if value="{{ hasBanner }}" hint-placeholder-val="{{ false }}"><div style="margin:0 20px 8px;padding:12px 14px;border-radius:12px;background:{{ bannerBg }};color:{{ bannerFg }};font-size:13px;font-weight:600;line-height:1.5">{{ bannerText }}</div></sc-if>
  <div style="flex:1;display:flex;flex-direction:column">
    <sc-if value="{{ onTasks }}" hint-placeholder-val="{{ true }}">
      <div style="padding:8px 20px 24px;display:flex;flex-direction:column;gap:14px">
        <div style="font-size:15px;line-height:1.65;color:#2E3A38">Use <code style="font-family:'JetBrains Mono',monospace;font-size:.88em;background:#FBF3DF;color:#7A5510;border:1px solid #F0E2B8;padding:1px 6px;border-radius:6px">useState</code> to build a small to-do app. Type a task, tap Add, and show it in a list.</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:700">Tasks</span><span style="font-size:13px;color:#4A5856;font-weight:600">{{ doneLabel }}</span></div>
        <sc-for list="{{ tasks }}" as="t" hint-placeholder-count="4">
          <button onClick="{{ t.toggle }}" style="display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;border:0;background:{{ t.bg }};text-align:left;color:#16211F;min-height:52px" style-active="opacity:.7">
            <span style="width:22px;height:22px;flex:none;border-radius:6px;background:{{ t.boxBg }};border:1.5px solid {{ t.boxBorder }};color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center">{{ t.mark }}</span>
            <span style="font-size:14px;line-height:1.45;font-weight:500">{{ t.text }}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ onCode }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1;background:#16211F;display:flex;flex-direction:column">
        <div style="height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.08)"><span style="font:500 12px 'JetBrains Mono',monospace;color:#fff">App.jsx</span><button onClick="{{ run }}" style="height:34px;padding:0 12px;border-radius:8px;border:0;background:#F2A93B;color:#16211F;font-size:13px;font-weight:700" style-active="opacity:.7">▶ Run</button></div>
        <div style="padding:12px 14px;font:500 11px/1.75 'JetBrains Mono',monospace;color:#E7F3F0;overflow-x:auto"><sc-for list="{{ code }}" as="ln" hint-placeholder-count="12"><div style="display:flex;gap:10px;min-height:1.75em"><span style="width:16px;flex:none;text-align:right;color:#5E6E6B">{{ ln.n }}</span><div style="white-space:pre"><sc-for list="{{ ln.toks }}" as="k" hint-placeholder-count="3"><span style="color:{{ k.c }};font-style:{{ k.i }}">{{ k.t }}</span></sc-for></div></div></sc-for></div>
      </div>
    </sc-if>
    <sc-if value="{{ onPreview }}" hint-placeholder-val="{{ false }}">
      <div style="padding:8px 20px 24px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:space-between"><span style="font:500 11px 'JetBrains Mono',monospace;color:#4A5856;letter-spacing:.08em">PREVIEW</span><span style="font-size:12px;font-weight:600;color:#0E5E52">{{ checksLabel }}</span></div>
        <sc-if value="{{ notRan }}" hint-placeholder-val="{{ true }}"><div style="font-size:14px;color:#4A5856">Run your code from the Code tab to see the app here.</div></sc-if>
        <sc-if value="{{ ran }}" hint-placeholder-val="{{ false }}">
          <form onSubmit="{{ addTodo }}" style="display:flex;gap:8px"><input value="{{ text }}" onChange="{{ onText }}" placeholder="New task" style="flex:1;min-width:0;height:44px;border:1px solid #D5DDDA;border-radius:10px;padding:0 12px;font-size:16px;outline-color:#0E5E52"><button type="submit" style="height:44px;padding:0 16px;border-radius:10px;border:0;background:#16211F;color:#fff;font-size:14px;font-weight:600" style-active="opacity:.7">Add</button></form>
          <div style="display:flex;flex-direction:column;gap:6px;font-size:15px;color:#2E3A38"><sc-for list="{{ todos }}" as="td" hint-placeholder-count="2"><div>• {{ td.t }}</div></sc-for></div>
        </sc-if>
      </div>
    </sc-if>
  </div>
  <div style="position:sticky;bottom:0;padding:12px 20px 30px;border-top:1px solid #E3E8E6;background:#fff"><button onClick="{{ submit }}" style="width:100%;height:54px;border-radius:12px;border:0;background:#0E5E52;color:#fff;font-weight:700;font-size:16px" style-active="opacity:.7">Submit practice</button></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { D: null, tab: 'tasks', done: [true, true, false, false], ran: false, text: '', todos: ['Watch lesson 3', 'Read the JSX article'], banner: null };
  componentDidMount() { this.boot = () => import(new URL('sl-data.js', location.href).href).then(D => { this.setState({ D, status: 'loading' }); return D.load().then(() => this.setState({ status: 'ready' }), () => this.setState({ status: 'error' })); });
    this.boot(); }
  renderVals() {
    const st = this.state.status || 'loading';
    const base = { status: st, ready: st === 'ready', notReady: st !== 'ready', retry: () => { this.setState({ status: 'loading' }); this.boot(); } };
    if (st !== 'ready' || !this.state.D) return base;
    const v = this.vals();
    if (v.__notfound) return { ...base, status: 'notfound', ready: false, notReady: true };
    return { ...base, ...v };
  }
  vals() {
    const D = this.state.D; if (!D) return {};
    const s = this.state, n = s.done.filter(Boolean).length, all = n === s.done.length;
    return {
      tabs: [['tasks', 'Tasks'], ['code', 'Code'], ['preview', 'Preview']].map(([id, name]) => ({ name, pick: () => this.setState({ tab: id }), bg: s.tab === id ? '#fff' : 'transparent', color: s.tab === id ? '#16211F' : '#4A5856' })),
      onTasks: s.tab === 'tasks', onCode: s.tab === 'code', onPreview: s.tab === 'preview',
      code: D.hl(D.CODE.practice),
      tasks: D.PRACTICE_TASKS.map((text, i) => {
        const d = s.done[i];
        return { text, mark: d ? '✓' : '', bg: d ? '#E7F3F0' : '#F6F8F7', boxBg: d ? '#0E5E52' : '#fff', boxBorder: d ? '#0E5E52' : '#B9C4C1',
          toggle: () => this.setState({ done: s.done.map((x, j) => (j === i ? !x : x)), banner: null }) };
      }),
      doneLabel: n + ' of 4 done', checksLabel: s.ran ? n + ' of 4 checks passed' : '',
      run: () => this.setState({ ran: true, tab: 'preview' }), ran: s.ran, notRan: !s.ran,
      text: s.text, onText: (e) => this.setState({ text: e.target.value }), todos: s.todos.map(t => ({ t })),
      addTodo: (e) => { e.preventDefault(); if (s.text.trim()) this.setState({ todos: [...s.todos, s.text.trim()], text: '' }); },
      submit: () => this.setState({ banner: all ? 'ok' : 'todo' }), hasBanner: !!s.banner,
      bannerBg: s.banner === 'ok' ? '#0E5E52' : '#FBF3DF', bannerFg: s.banner === 'ok' ? '#fff' : '#5E420C',
      bannerText: s.banner === 'ok' ? 'Practice submitted. Lesson 6 is complete.' : 'Finish all 4 tasks before submitting.'
    };
  }
}
</script>
</body>
</html>
