<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><style>body{margin:0;background:#F6F8F7;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#16211F;-webkit-font-smoothing:antialiased}a{color:#0E5E52;text-decoration:none}a:hover{color:#0B4D43}*{box-sizing:border-box}input,button,textarea{font-family:inherit}</style></helmet>
<div data-screen-label="Web Search" style="min-height:100vh;background:#F6F8F7">
  <dc-import name="WebNav" active="none" hint-size="100%,68px" style="position:sticky;top:0;z-index:10"></dc-import>
  <sc-if value="{{ notReady }}" hint-placeholder-val="{{ false }}"><dc-import name="StatusBlock" kind="{{ status }}" layout="grid" platform="web" on-retry="{{ retry }}" hint-size="100%,640px"></dc-import></sc-if>
  <sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
  <div style="max-width:1200px;margin:0 auto;padding:36px 40px 64px;display:flex;flex-direction:column;gap:24px">
    <div style="font-size:30px;font-weight:800;letter-spacing:-.02em">Search</div>
    <div style="height:56px;border-radius:14px;background:#fff;border:2px solid #0E5E52;display:flex;align-items:center;gap:12px;padding:0 18px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E5E52" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input value="{{ q }}" onChange="{{ onQ }}" placeholder="Try “React”, “SEO” or “Figma”" style="flex:1;min-width:0;border:0;outline:none;font-size:17px;color:#16211F;background:transparent">
      <sc-if value="{{ hasQ }}" hint-placeholder-val="{{ false }}"><button onClick="{{ clear }}" style="border:0;background:#EEF1F0;border-radius:999px;height:28px;padding:0 12px;font-size:13px;font-weight:600;cursor:pointer;color:#16211F;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s,color .15s" style-hover="border-color:#0E5E52;color:#0E5E52">Clear</button></sc-if>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <sc-for list="{{ types }}" as="t" hint-placeholder-count="5"><button onClick="{{ t.pick }}" style="padding:8px 14px;border-radius:999px;border:1px solid {{ t.border }};background:{{ t.bg }};color:{{ t.color }};font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s,color .15s" style-hover="border-color:#0E5E52;color:#0E5E52">{{ t.name }}</button></sc-for>
      </div>
      <div style="font-size:14px;color:#4A5856;font-weight:500">{{ countLabel }}</div>
    </div>
    <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px">
        <sc-for list="{{ results }}" as="c" hint-placeholder-count="6">
          <div style="position:relative;background:#fff;border:1px solid #E3E8E6;border-radius:14px;overflow:hidden;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s,color .15s" style-hover="border-color:#9FC5BC;box-shadow:0 8px 24px rgba(14,94,82,.10);transform:translateY(-2px)">
            <a href="{{ c.href }}" style="display:flex;flex-direction:column;color:#16211F">
              <div style="height:150px;background-color:{{ c.tint }};background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.4) 0 10px,transparent 10px 20px);padding:12px"><span style="padding:5px 10px;border-radius:999px;background:#fff;color:{{ c.fg }};font-size:12px;font-weight:700">{{ c.catName }}</span></div>
              <div style="padding:16px;display:flex;flex-direction:column;gap:8px">
                <div style="font-size:16px;font-weight:700;line-height:1.35;text-wrap:pretty">{{ c.title }}</div>
                <div style="font-size:13px;color:#4A5856">{{ c.meta }}</div>
                <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:4px"><span style="font-weight:600;color:#4A5856">{{ c.level }}</span><span style="font-weight:700">★ {{ c.rating }}</span></div>
              </div>
            </a>
            <button onClick="{{ c.toggle }}" title="{{ c.favLabel }}" style="position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s,color .15s" style-hover="background:#E7F3F0"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{ c.favFill }}" stroke="{{ c.favStroke }}" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></button>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
      <div style="background:#fff;border:1px dashed #C9D3D0;border-radius:16px;padding:56px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center">
        <div style="width:56px;height:56px;border-radius:16px;background:#EEF1F0;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4A5856" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5M8 11h6"></path></svg></div>
        <div style="font-size:20px;font-weight:700">No results for “{{ q }}”</div>
        <div style="font-size:14px;color:#4A5856;max-width:380px">Check the spelling, try a shorter keyword, or browse a category.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
          <sc-for list="{{ cats }}" as="k" hint-placeholder-count="4"><a href="{{ k.href }}" style="padding:8px 14px;border-radius:999px;background:#E7F3F0;color:#0E5E52;font-size:13px;font-weight:600;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s,color .15s" style-hover="border-color:#0E5E52;color:#0E5E52">{{ k.name }}</a></sc-for>
        </div>
      </div>
    </sc-if>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { D: null, favs: null, q: null, type: 'All' };
  componentDidMount() {
    this.boot = () => import(new URL('sl-data.js', location.href).href).then(D => { this.setState({ D, favs: D.getFavs(), q: D.param('q') || '', status: 'loading' }); return D.load().then(() => this.setState({ status: 'ready' }), () => this.setState({ status: 'error' })); });
    this.boot();
    window.addEventListener('hashchange', () => this.state.D && this.setState({ q: this.state.D.param('q') || '' }));
  }
  renderVals() {
    const st = this.state.status || 'loading';
    const base = { status: st, ready: st === 'ready', notReady: st !== 'ready', retry: () => { this.setState({ status: 'loading' }); this.boot(); } };
    if (st !== 'ready' || !this.state.D) return base;
    const v = this.vals();
    if (v.__notfound) return { ...base, status: 'notfound', ready: false, notReady: true };
    return { ...base, ...v };
  }
  vals() {
    const D = this.state.D; if (!D) return {};
    const s = this.state, set = (f) => this.setState({ favs: f });
    const res = D.search(s.q, s.type).map(c => D.card('web', c, s.favs, set));
    return {
      q: s.q, hasQ: !!s.q,
      onQ: (e) => this.setState({ q: e.target.value }),
      clear: () => this.setState({ q: '' }),
      types: ['All', 'Video', 'Article', 'Quiz', 'Practice'].map(name => {
        const on = s.type === name;
        return { name, pick: () => this.setState({ type: name }), bg: on ? '#16211F' : '#fff', color: on ? '#fff' : '#4A5856', border: on ? '#16211F' : '#E3E8E6' };
      }),
      results: res, hasResults: res.length > 0, noResults: res.length === 0,
      countLabel: res.length + (res.length === 1 ? ' course' : ' courses'),
      cats: D.CATS.map(k => ({ name: k.name, href: D.page('web', 'Category', 'c=' + k.id) }))
    };
  }
}
</script>
</body>
</html>
