<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><style>body{margin:0;background:#E3E8E6;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#16211F;-webkit-font-smoothing:antialiased}a{color:#0E5E52;text-decoration:none}a:hover{color:#0B4D43}*{box-sizing:border-box}input,button,textarea{font-family:inherit}</style></helmet>
<div data-screen-label="Mobile Search" style="width:100%;max-width:390px;min-height:100vh;margin:0 auto;background:#F6F8F7;display:flex;flex-direction:column">
  <sc-if value="{{ notReady }}" hint-placeholder-val="{{ false }}"><dc-import name="StatusBlock" kind="{{ status }}" layout="grid" platform="m" on-retry="{{ retry }}" hint-size="100%,640px"></dc-import></sc-if>
  <sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
  <div style="height:50px;flex:none;padding:0 28px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700"><span>9:41</span><span style="width:24px;height:11px;border:1.5px solid #16211F;border-radius:3px"></span></div>
  <div style="flex:1;padding:8px 20px 28px;display:flex;flex-direction:column;gap:16px">
    <span style="font-size:24px;font-weight:800;letter-spacing:-.02em">Search</span>
    <div style="height:52px;border-radius:12px;background:#fff;border:2px solid #0E5E52;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E5E52" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input value="{{ q }}" onChange="{{ onQ }}" placeholder="React, SEO, Figma…" style="flex:1;min-width:0;border:0;outline:none;font-size:16px;color:#16211F;background:transparent">
      <sc-if value="{{ hasQ }}" hint-placeholder-val="{{ false }}"><button onClick="{{ clear }}" style="width:36px;height:36px;border:0;border-radius:50%;background:#EEF1F0;font-size:14px;color:#16211F" style-active="opacity:.7">✕</button></sc-if>
    </div>
    <div style="display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px">
      <sc-for list="{{ types }}" as="t" hint-placeholder-count="5"><button onClick="{{ t.pick }}" style="flex:none;height:38px;padding:0 14px;border-radius:999px;border:1px solid {{ t.border }};background:{{ t.bg }};color:{{ t.color }};font-size:13px;font-weight:600" style-active="opacity:.7">{{ t.name }}</button></sc-for>
    </div>
    <span style="font-size:13px;color:#4A5856;font-weight:500">{{ countLabel }}</span>
    <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:10px">
        <sc-for list="{{ results }}" as="c" hint-placeholder-count="5">
          <div style="position:relative;background:#fff;border:1px solid #E3E8E6;border-radius:14px">
            <a href="{{ c.href }}" style="padding:10px 52px 10px 10px;display:flex;gap:12px;align-items:center;color:#16211F" style-active="opacity:.7">
              <span style="width:72px;height:72px;flex:none;border-radius:10px;background-color:{{ c.tint }};background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.4) 0 8px,transparent 8px 16px)"></span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font-size:11px;font-weight:700;color:{{ c.fg }}">{{ c.catName }}</span><span style="font-size:14px;font-weight:700;line-height:1.3">{{ c.title }}</span><span style="font-size:12px;color:#4A5856">{{ c.type }} · {{ c.dur }} · ★ {{ c.rating }}</span></span>
            </a>
            <button onClick="{{ c.toggle }}" title="{{ c.favLabel }}" style="position:absolute;right:6px;top:6px;width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center" style-active="opacity:.7"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{ c.favFill }}" stroke="{{ c.favStroke }}" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></button>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
      <div style="background:#fff;border:1px dashed #C9D3D0;border-radius:16px;padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
        <div style="width:52px;height:52px;border-radius:14px;background:#EEF1F0;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4A5856" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5M8 11h6"></path></svg></div>
        <div style="font-size:18px;font-weight:700">No results for “{{ q }}”</div>
        <div style="font-size:14px;color:#4A5856;line-height:1.5">Try a shorter keyword or browse a category.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
          <sc-for list="{{ cats }}" as="k" hint-placeholder-count="4"><a href="{{ k.href }}" style="height:38px;padding:0 14px;border-radius:999px;background:#E7F3F0;color:#0E5E52;font-size:13px;font-weight:600;display:flex;align-items:center" style-active="opacity:.7">{{ k.name }}</a></sc-for>
        </div>
      </div>
    </sc-if>
  </div>
  </sc-if>
  <dc-import name="MobileTabBar" active="search" hint-size="100%,84px" style="position:sticky;bottom:0;z-index:10"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { D: null, favs: null, q: '', type: 'All' };
  componentDidMount() { this.boot = () => import(new URL('sl-data.js', location.href).href).then(D => { this.setState({ D, favs: D.getFavs(), q: D.param('q') || '', status: 'loading' }); return D.load().then(() => this.setState({ status: 'ready' }), () => this.setState({ status: 'error' })); });
    this.boot(); }
  renderVals() {
    const st = this.state.status || 'loading';
    const base = { status: st, ready: st === 'ready', notReady: st !== 'ready', retry: () => { this.setState({ status: 'loading' }); this.boot(); } };
    if (st !== 'ready' || !this.state.D) return base;
    const v = this.vals();
    if (v.__notfound) return { ...base, status: 'notfound', ready: false, notReady: true };
    return { ...base, ...v };
  }
  vals() {
    const D = this.state.D; if (!D) return {};
    const s = this.state, set = (f) => this.setState({ favs: f });
    const res = D.search(s.q, s.type).map(c => D.card('m', c, s.favs, set));
    return {
      q: s.q, hasQ: !!s.q, onQ: (e) => this.setState({ q: e.target.value }), clear: () => this.setState({ q: '' }),
      types: ['All', 'Video', 'Article', 'Quiz', 'Practice'].map(name => {
        const on = s.type === name;
        return { name, pick: () => this.setState({ type: name }), bg: on ? '#16211F' : '#fff', color: on ? '#fff' : '#4A5856', border: on ? '#16211F' : '#E3E8E6' };
      }),
      results: res, hasResults: res.length > 0, noResults: res.length === 0,
      countLabel: res.length + (res.length === 1 ? ' course' : ' courses'),
      cats: D.CATS.map(k => ({ name: k.name, href: D.page('m', 'Category', 'c=' + k.id) }))
    };
  }
}
</script>
</body>
</html>
