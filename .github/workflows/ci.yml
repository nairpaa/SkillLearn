# Dijalankan di setiap push & pull request: unit/integration test, build, dan npm audit.
# Sesuai dokumen arsitektur: "GitHub + GitHub Actions: lint, test, dan npm audit di setiap push".
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (Express + MongoDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # MongoDB untuk test disediakan mongodb-memory-server, jadi tidak perlu service container.
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      # Memastikan bundle Expo Go/APK bisa dibuat (sama seperti yang dibaca Expo Go saat scan QR).
      - run: npx expo export --platform android --output-dir /tmp/expo-export
      - run: npm audit --omit=dev --audit-level=high
